<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北村 祐人 | CHARACTER</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d; color: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6; padding: 60px 10px 30px;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: 50px;
      background-color: rgba(0, 0, 0, 0.9); display: flex; align-items: center; padding: 0 15px; z-index: 1000; border-bottom: 1px solid #333;
    }
    .logo { font-weight: 900; font-size: 1.2rem; color: #e60012; }
    
    .detail-card {
      width: 100%; max-width: 600px; background-color: #1a1a1a;
      border: 1px solid #333; border-radius: 8px; overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
    }

    /* ----------------------------------
       3D回転カード（縦横比固定調整済み）
    ---------------------------------- */
    .card-flip-wrapper {
      perspective: 1000px;
      width: 100%;
    }
    .card-flip-inner {
      position: relative;
      width: 100%;
      transform-style: preserve-3d;
      /* 1秒待機(delay)した後に 0.8秒かけて横回転 */
      animation: flipCard 0.8s cubic-bezier(0.4, 0.2, 0.2, 1) 1s forwards;
    }
    
    /* 表面の高さに合わせてベースの形を作る */
    .card-face {
      width: 100%;
      height: auto;
      display: block;
      backface-visibility: hidden; /* 裏返った時に非表示 */
    }

    /* 裏面画像の設定（表と同じ枠にぴったりトリミングフィットさせる） */
    .card-face.back {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* 縦長画像も黒背景で綺麗に枠内へ収める */
      background-color: #000000;
      transform: rotateY(180deg);
    }

    /* 180度回転アニメーション */
    @keyframes flipCard {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(180deg); }
    }

    .btn-group { display: flex; gap: 10px; padding: 18px 15px; background-color: #141414; }
    .btn-link {
      flex: 1; text-align: center; padding: 12px 0; background-color: #222;
      color: #fff; text-decoration: none; font-size: 0.85rem; font-weight: bold;
      border-radius: 4px; border: 1px solid #444; transition: background 0.2s;
    }
    .btn-link:hover { background-color: #e60012; border-color: #e60012; }
  </style>
</head>
<body>

  <header><div class="logo">PORTFOLIO</div></header>

  <div class="detail-card">
    
    <!-- 回転カード構造 -->
    <div class="card-flip-wrapper">
      <div class="card-flip-inner">
        <!-- 表面: キメ顔画像 (chara-pins) -->
        <img src="./chara-pins/02.png" alt="表の顔" class="card-face front">
        <!-- 裏面: リアル画像 (real-me) -->
        <img src="./real-me/002.jpg" alt="裏の顔" class="card-face back">
      </div>
    </div>

    <div class="btn-group">
      <a href="detail.html" class="btn-link">← 一覧へ戻る</a>
      <a href="index.html" class="btn-link">トップへ戻る</a>
    </div>
  </div>

</body>
</html>
