<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登場人物一覧 | CHARACTER</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111111; color: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      padding: 70px 15px 40px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: 50px;
      background-color: rgba(0, 0, 0, 0.9); display: flex; align-items: center; padding: 0 15px; z-index: 1000; border-bottom: 1px solid #333;
    }
    .logo { font-weight: 900; font-size: 1.2rem; color: #e60012; }
    .title-area { text-align: center; margin-bottom: 30px; }
    .page-title { font-size: 2.2rem; font-weight: 900; color: #e60012; letter-spacing: 2px; }
    .page-sub { font-size: 0.85rem; color: #aaa; }

    .character-grid {
      width: 100%; max-width: 500px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    }
    .char-card {
      background-color: #1a1a1a; border-radius: 6px; overflow: hidden; border: 1px solid #333;
      display: flex; flex-direction: column; align-items: center; text-decoration: none; transition: transform 0.2s, border-color 0.2s;
    }
    .char-card:hover { transform: translateY(-3px); border-color: #e60012; }
    .char-thumb { width: 100%; aspect-ratio: 16/9; background-color: #333; background-size: cover; background-position: center; }
    .char-meta { padding: 8px 4px; text-align: center; width: 100%; }
    .char-name { font-size: 0.75rem; font-weight: bold; color: #ffffff; line-height: 1.2; }

    .btn-back {
      margin-top: 35px; padding: 10px 25px; background-color: #222; color: #fff;
      text-decoration: none; font-size: 0.85rem; border-radius: 4px; border: 1px solid #444;
    }
  </style>
</head>
<body>

  <header><div class="logo">PORTFOLIO</div></header>

  <div class="title-area">
    <h1 class="page-title">CHARACTER</h1>
    <p class="page-sub">登場人物一覧</p>
  </div>

  <div class="character-grid">
    <a href="char1.html" class="char-card">
      <div class="char-thumb" style="background-image: url('./chara-pins/01.png');"></div>
      <div class="char-meta"><div class="char-name">北村 祐人</div></div>
    </a>
    <a href="char2.html" class="char-card">
      <div class="char-thumb" style="background-image: url('./chara-pins/02.png');"></div>
      <div class="char-meta"><div class="char-name">中澤 陽</div></div>
    </a>
    <a href="char3.html" class="char-card">
      <div class="char-thumb" style="background-image: url('./chara-pins/03.png');"></div>
      <div class="char-meta"><div class="char-name">早川 実友</div></div>
    </a>
    <a href="char4.html" class="char-card">
      <div class="char-thumb" style="background-image: url('./chara-pins/04.png');"></div>
      <div class="char-meta"><div class="char-name">小谷野 夏菜</div></div>
    </a>
    <a href="char5.html" class="char-card">
      <div class="char-thumb" style="background-image: url('./chara-pins/05.png');"></div>
      <div class="char-meta"><div class="char-name">山下 眞奈</div></div>
    </a>
    <a href="char6.html" class="char-card">
      <div class="char-thumb" style="background-image: url('./chara-pins/06.png');"></div>
      <div class="char-meta"><div class="char-name">滝口 友香</div></div>
    </a>
    <a href="char7.html" class="char-card">
      <div class="char-thumb" style="background-image: url('./chara-pins/07.png');"></div>
      <div class="char-meta"><div class="char-name">傍田 茉央</div></div>

    <a href="char8.html" class="char-card">
      <div class="char-thumb" style="background-image: url('.08.png');"></div>
      <div class="char-meta"><div class="char-name">海野 凜生</div></div>
    </a>
    <a href="char9.html" class="char-card">
      <div class="char-thumb" style="background-image: url('.09.png');"></div>
      <div class="char-meta"><div class="char-name">永原 香奈</div></div>
    </a>
  </div>

  <a href="vivant_index.html" class="btn-back">← トップページに戻る</a>

</body>
</html>
